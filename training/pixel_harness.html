<!doctype html>
<meta charset="utf-8">
<title>Pixel pipeline evaluation harness</title>
<canvas id="scene" width="900" height="900"></canvas>
<script type="module">
// Scores the complete screenshot-only pipeline, in a real browser, using the
// same modules the game loads. Nothing here reaches into the generator: each
// round renders a truss, and the AI is handed the canvas and nothing else.
import { Truss, accuracy } from '../web/src/truss.js';
import { mulberry32 } from '../web/src/random.js';
import { PHYSICS } from '../web/src/config.js';
import { drawScene } from '../web/src/renderer.js';
import { TrussDetector, readTruss, findMembers } from '../web/src/detect.js';
import { TrussGNN } from '../web/src/gnn.js';
import { triangulate, edgesOf } from '../web/src/delaunay.js';
import { predictClick } from '../web/src/ai.js';

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

// ?nodes= and ?force= let the same pipeline be scored on a thinner truss.
// Fewer load paths means displacement depends much more on geometry and grows
// with it, so scale the load down alongside ?nodes= to keep joints in frame.
const params = new URLSearchParams(location.search);
const NUM_NODES = Number(params.get('nodes') || 0) || undefined;
const FORCE = PHYSICS.force * Number(params.get('force') || 1);
const OPTS = NUM_NODES ? { numNodes: NUM_NODES } : {};
const detector = await TrussDetector.load(
  params.get('detector') || '../web/src/model/trussdetector.json');
const gnn = await TrussGNN.load(params.get('gnn') || '../web/src/model/trussgnn.json');
// The decode takes a fixed number of peaks per class -- [7, 2, 1] for the
// ten-node game. Two supports and one loaded node hold at any size; only the
// plain-node count tracks numNodes. ?counts= overrides it so a different board
// can be scored without retraining the detector.
if (params.get('counts')) {
  detector.counts = params.get('counts').split(',').map(Number);
} else if (NUM_NODES) {
  detector.counts = [NUM_NODES - 3, 2, 1];
}

window.evaluateRange = function (start, count, seedBase, rounds) {
  const results = [];
  for (let i = 0; i < count; i++) {
    const seed = seedBase + start + i;
    const truth = new Truss(mulberry32(seed), OPTS);

    // The undeformed frame -- exactly what the player is looking at when they
    // commit to a guess, and the only thing the AI receives.
    drawScene(ctx, truth);

    const t0 = performance.now();
    const seen = readTruss(detector, canvas);
    const detectMs = performance.now() - t0;

    let score = 0;
    let click = null;
    let ok = seen.loadedNode >= 0 && seen.supports.length === 2;
    if (ok) {
      try {
        click = predictClick(gnn, seen, { sigma: 0, rounds });
        ok = Number.isFinite(click[0]) && Number.isFinite(click[1]);
      } catch (e) {
        ok = false;
      }
    }

    truth.calculate(FORCE);
    if (ok) score = accuracy(truth.loadedStart, truth.loadedEnd, click);

    // How far the detector put each true node, after nearest-pair matching.
    const errors = truth.nodes.map((p) => {
      let best = Infinity;
      for (const q of seen.nodes) best = Math.min(best, Math.hypot(p[0] - q[0], p[1] - q[1]));
      return best;
    });

    results.push({
      seed,
      score,
      ok,
      detectMs,
      members: seen.elements.length,
      trueMembers: truth.elements.length,
      nodeError: errors.reduce((a, b) => a + b, 0) / errors.length,
      worstNode: Math.max(...errors),
    });
  }
  return results;
};

// Sweep member-detection parameters against the real detector's node error.
// Renders and detects once per seed, then scores every configuration on the
// same detections, so the CNN cost is paid once rather than per configuration.
window.sweepMembers = function (start, count, seedBase, configs) {
  const totals = configs.map(() => ({ perfect: 0, missed: 0, spurious: 0 }));
  for (let i = 0; i < count; i++) {
    const truth = new Truss(mulberry32(seedBase + start + i), OPTS);
    drawScene(ctx, truth);
    const found = detector.findNodes(canvas);
    const points = found.map((n) => n.position);
    const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);

    // Match detected nodes to true ones so the member sets are comparable.
    const map = points.map((p) => {
      let best = -1;
      let bestD = Infinity;
      truth.nodes.forEach((q, k) => {
        const d = Math.hypot(p[0] - q[0], p[1] - q[1]);
        if (d < bestD) { bestD = d; best = k; }
      });
      return best;
    });
    const want = new Set(truth.elements.map(([a, b]) => [a, b].sort((x, y) => x - y).join(',')));

    configs.forEach((cfg, c) => {
      const got = new Set(
        findMembers(canvas, points, { ...cfg, pixels })
          .map(([a, b]) => [map[a], map[b]].sort((x, y) => x - y).join(','))
      );
      let missed = 0;
      let spurious = 0;
      for (const e of want) if (!got.has(e)) missed++;
      for (const e of got) if (!want.has(e)) spurious++;
      totals[c].missed += missed;
      totals[c].spurious += spurious;
      if (missed === 0 && spurious === 0) totals[c].perfect++;
    });
  }
  return totals;
};

// Dump what the browser computes for one truss, so verify_detector.py can hold
// it against PyTorch. Covers the whole chain the game depends on: the capture
// crop and downscale, the convolution runtime, and the peak decode.
// How well would members be recovered by triangulating the DETECTED nodes,
// rather than reading them from pixels? That assumes the generator builds a
// Delaunay truss -- prior knowledge about the game, not extra input from the
// screen -- so it is a design choice, not a free win. This measures the size
// of the prize before anyone decides whether to take it.
window.countNodes = function (start, count, seedBase) {
  const hist = {};
  let sum = 0;
  for (let i = 0; i < count; i++) {
    const truth = new Truss(mulberry32(seedBase + start + i), OPTS);
    drawScene(ctx, truth);
    const found = detector.findNodes(canvas).length;
    hist[found] = (hist[found] || 0) + 1;
    sum += found;
  }
  return { hist, mean: sum / count };
};

window.compareMemberSources = function (start, count, seedBase) {
  const t = { pixelPerfect: 0, delaunayPerfect: 0, n: 0 };
  for (let i = 0; i < count; i++) {
    const truth = new Truss(mulberry32(seedBase + start + i), OPTS);
    drawScene(ctx, truth);
    const points = detector.findNodes(canvas).map((n) => n.position);
    const map = points.map((p) => {
      let best = -1, bestD = Infinity;
      truth.nodes.forEach((q, k) => {
        const d = Math.hypot(p[0] - q[0], p[1] - q[1]);
        if (d < bestD) { bestD = d; best = k; }
      });
      return best;
    });
    const key = (a, b) => [a, b].sort((x, y) => x - y).join(',');
    const want = new Set(truth.elements.map(([a, b]) => key(a, b)));
    const same = (got) => got.size === want.size && [...got].every((e) => want.has(e));
    const pix = new Set(findMembers(canvas, points).map(([a, b]) => key(map[a], map[b])));
    const del = new Set(edgesOf(triangulate(points)).map(([a, b]) => key(map[a], map[b])));
    if (same(pix)) t.pixelPerfect++;
    if (same(del)) t.delaunayPerfect++;
    t.n++;
  }
  return t;
};

window.dumpDetection = function (seed) {
  const truss = new Truss(mulberry32(seed), OPTS);
  drawScene(ctx, truss);
  const input = detector._input(canvas);
  const nodes = detector.findNodes(canvas);
  return {
    seed,
    inputSize: detector.inputSize,
    // Subsampled: the full tensor is megabytes of JSON and every 977th element
    // is plenty to catch a systematic difference in the capture path.
    inputProbe: Array.from({ length: 256 }, (_, i) => input[(i * 977) % input.length]),
    inputSum: input.reduce((a, b) => a + b, 0),
    nodes: nodes.map((n) => ({ position: n.position, role: n.role, score: n.score })),
    members: findMembers(canvas, nodes.map((n) => n.position)),
  };
};

window.harnessReady = true;
</script>
