<!doctype html>
<meta charset="utf-8">
<title>v2 model probe</title>
<script type="module">
// Loads a 768px crop PNG and runs the JS replay of the v2 tflite model on it,
// so its prediction can be compared against LiteRT reading the same file.
import { TrussV2Model } from '../web/src/tflite.js';

const model = await TrussV2Model.load('../web/src/model/trussv2.json');
const canvas = document.createElement('canvas');
canvas.width = 768;
canvas.height = 768;
const ctx = canvas.getContext('2d', { willReadFrequently: true });

window.predictFromPng = async function (url) {
  const image = new Image();
  image.src = url;
  await image.decode();
  ctx.drawImage(image, 0, 0);
  const { data } = ctx.getImageData(0, 0, 768, 768);

  // RGBA to RGB, kept as raw 0-255: the original fed pygame's surface straight
  // into the interpreter with no normalisation.
  const rgb = new Float32Array(768 * 768 * 3);
  for (let i = 0, j = 0; i < data.length; i += 4, j += 3) {
    rgb[j] = data[i];
    rgb[j + 1] = data[i + 1];
    rgb[j + 2] = data[i + 2];
  }
  return model.predict({ data: rgb, height: 768, width: 768, channels: 3 });
};

window.probeReady = true;
</script>
