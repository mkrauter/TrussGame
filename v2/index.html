<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truss Game v2</title>
<style>
  :root { color-scheme: dark; }
  /* Same colour as the canvas background (RENDER.background in src/config.js),
     so the letterboxing around the square canvas is invisible and the page
     reads as one surface. */
  html, body {
    height: 100%;
    margin: 0;
    background: #404040;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Backing store stays exactly 900x900 so the model crop is pixel-exact; CSS
     only scales the display. Square and clamped to the shorter viewport axis,
     so the whole game fits without scrolling -- the HUD is drawn inside the
     canvas rather than as sibling elements that would push it off screen. */
  canvas {
    display: block;
    width: min(100vh, 100vw);
    height: min(100vh, 100vw);
    /* Plain arrow, not crosshair: the guess marker is itself a cross, and two
       crosses on screen read as one thing duplicated. */
    cursor: default;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
