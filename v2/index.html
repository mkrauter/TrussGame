<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truss Game v2</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #1b1b1b;
    color: #e8e8e8;
    font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
  }
  #hud { display: flex; gap: 24px; align-items: baseline; }
  #user-score { font-size: 40px; font-weight: 600; min-width: 3ch; }
  #user-average, #prompt { opacity: 0.7; }
  /* Backing store stays exactly 900x900 so the model crop is pixel-exact;
     CSS only scales the display. */
  canvas {
    width: min(90vh, 90vw);
    height: min(90vh, 90vw);
    border-radius: 6px;
    cursor: crosshair;
  }
</style>
</head>
<body>
  <div id="hud">
    <span id="user-score">&mdash;</span>
    <span id="user-average"></span>
  </div>
  <canvas id="game"></canvas>
  <div id="prompt"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
