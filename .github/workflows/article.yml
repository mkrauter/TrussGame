name: Render the article

# article.md is the source; web/article/index.html is generated from it. Keeping
# both by hand means they are free to drift, and nothing would warn you -- edit
# the markdown, forget the build, and the site quietly serves the old text. So
# the build happens here instead, and the rendered page is never edited by hand.
#
# Edit article.md, push, and the page follows.

on:
  push:
    branches: [master]
    paths:
      - 'article.md'
      - 'training/build_article.py'
      - '.github/workflows/article.yml'
  workflow_dispatch:

permissions:
  contents: write

# A second push while this is mid-flight would race to commit the same file.
concurrency:
  group: render-article
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The renderer needs nothing else, and pinning keeps a markdown release
      # from silently changing the generated HTML under us.
      - run: pip install 'markdown==3.10.3'

      - run: python training/build_article.py

      - name: Commit the rendered page if it changed
        run: |
          if git diff --quiet -- web/article/index.html; then
            echo "web/article/index.html is already up to date."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/article/index.html
          # skip ci is belt and braces: this workflow does not trigger on
          # web/article/**, but the guard costs nothing and stops any future
          # path change from looping.
          git commit -m 'Render the article from article.md [skip ci]'
          git push
