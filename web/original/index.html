<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truss game — the original</title>
<style>
  :root { color-scheme: dark; }
  /* Same colour as the canvas background (RENDER.background in src/config.js),
     so the letterboxing around the square canvas is invisible. */
  html, body {
    height: 100%;
    margin: 0;
    background: #404040;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vh, 100vw);
    height: min(100vh, 100vw);
    cursor: default;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="../src/original.js"></script>
</body>
</html>
