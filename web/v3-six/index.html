<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truss game v3, six nodes — you vs the AI</title>
<style>
  :root { color-scheme: dark; }
  /* Same colour as the canvas background (RENDER.background in src/config.js),
     so the letterboxing around the square canvas is invisible. */
  html, body {
    height: 100%;
    margin: 0;
    background: #404040;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vh, 100vw);
    height: min(100vh, 100vw);
    cursor: default;
  }
</style>
</head>
<!-- Six nodes instead of ten. Fewer load paths means the settled displacement
     depends much more on the geometry, so the "move it down by the average
     distance" strategy that scores 60% on the ten-node board -- roughly what an
     experienced human scores -- only scores 48% here. The board is easier to
     read and harder to guess, which is the combination worth playing. -->
<body data-nodes="6">
  <canvas id="game"></canvas>
  <script type="module" src="../src/versus.js"></script>
</body>
</html>
