<!doctype html>
<!--
  GitHub Pages serves this repository from its root, and the playable game lives
  in v2/. Without this file the bare project URL 404s, which is what anyone
  typing or sharing mkrauter.github.io/TrussGame/ would hit first.

  A meta refresh rather than JavaScript, so it works regardless, with a visible
  link as the fallback if the redirect is blocked.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Truss game</title>
<link rel="canonical" href="https://mkrauter.github.io/TrussGame/v2/">
<meta http-equiv="refresh" content="0; url=./v2/">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #404040;
    color: #f0f0f0;
    font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
    text-align: center;
  }
  a { color: #9db8ff; }
</style>
</head>
<body>
  <p>Taking you to <a href="./v2/">the truss game</a>&hellip;</p>
</body>
</html>
